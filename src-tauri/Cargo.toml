[package]
name = "pixup-pet"
version = "1.0.0"
description = "WebM desktop pets rendered on a transparent overlay"
edition = "2021"
license = "MIT"
rust-version = "1.93"

[lib]
name = "pixup_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
open = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
rayon = "1.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
