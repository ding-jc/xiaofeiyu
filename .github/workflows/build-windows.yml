name: build-windows

# 仅 Windows：应用本身只支持 Windows（见 README「平台与限制」）。
# main = 生产（发布），dev = 开发。打 tag 会自动建 draft release 并附上安装包。
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      with_assets:
        description: '构建时拉取上游角色素材（约 113MB，会明显变慢）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      # 仓库不收录角色素材（111MB，授权独立），构建时从对象存储拉取：
      # 打 tag 和手动勾选 with_assets 都会拉，日常 push / PR 不拉（省 111MB 流量）。
      - name: 拉取角色素材
        if: inputs.with_assets || startsWith(github.ref, 'refs/tags/v')
        run: npm run assets

      - name: 前端类型检查 + 构建
        run: npm run build

      - name: Rust 单测（格式转换 / 扫描 / 解压 / 深链导入）
        working-directory: src-tauri
        run: cargo test --lib

      - name: 打包 NSIS 安装包
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: xiaofeiyu-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/xiaofeiyu.exe

  # 打 tag 直接发布：安装包 + 源码（GitHub 自动附 tag 的 zip/tar.gz）
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xiaofeiyu-windows-${{ github.sha }}
          path: dist-artifact

      - name: 创建 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 发行说明只写「修复的 bug」和「新增功能」，零碎改动不列；
          # 没有大改动时只改版本号即可（本文件不用动）。
          gh release create "${GITHUB_REF_NAME}" \
            --title "小肥鱼宠物 ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            dist-artifact/*.exe
