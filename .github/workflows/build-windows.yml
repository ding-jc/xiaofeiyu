name: build-windows

# 仅 Windows：应用本身只支持 Windows（见 README「平台与限制」）。
# main = 生产（发布），dev = 开发。打 tag 会自动建 draft release 并附上安装包。
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      with_assets:
        description: '构建时拉取上游角色素材（约 113MB，会明显变慢）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # 仓库 Secret 里配了签名证书才会真正执行签名步骤；没配则为空，自动跳过。
    env:
      WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      # 仓库不收录角色素材（111MB，授权独立），构建时从对象存储拉取：
      # 打 tag 和手动勾选 with_assets 都会拉，日常 push / PR 不拉（省 111MB 流量）。
      - name: 拉取角色素材
        if: inputs.with_assets || startsWith(github.ref, 'refs/tags/v')
        run: npm run assets

      - name: 前端类型检查 + 构建
        run: npm run build

      - name: Rust 单测（格式转换 / 扫描 / 解压 / 深链导入）
        working-directory: src-tauri
        run: cargo test --lib

      - name: 打包 NSIS 安装包
        run: npx tauri build --bundles nsis

      # 备选路径：自备 PFX 证书时在这里签。配了 SignPath 就交给下面的 sign 任务，
      # 避免同一份文件签两遍。证书缺失时脚本直接放行（exit 0）。
      - name: 代码签名（自备 PFX）
        if: env.WIN_CERT_PFX_BASE64 != '' && vars.SIGNPATH_PROJECT_SLUG == '' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          WIN_CERT_CSP: ${{ secrets.WIN_CERT_CSP }}
          WIN_CERT_KC: ${{ secrets.WIN_CERT_KC }}
        run: |
          $targets = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*-setup.exe' -ErrorAction SilentlyContinue)
          $targets += @(Get-ChildItem -Path 'src-tauri/target/release/xiaofeiyu.exe' -ErrorAction SilentlyContinue)
          if ($targets.Count -eq 0) { throw '没有找到可签名的产物' }
          foreach ($t in $targets) {
            ./src-tauri/sign.ps1 $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "签名失败: $($t.FullName)" }
          }

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: xiaofeiyu-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/xiaofeiyu.exe

  # SignPath Foundation 免费开源签名：私钥在 SignPath 的 HSM 里，CI 只「送件—取件」。
  # 未在仓库 Variables 里配 SIGNPATH_PROJECT_SLUG 时整体跳过，不影响现有流程。
  # 每个签名请求都需要 approver 在 SignPath 后台人工点一次批准（见 README「Code signing policy」）。
  sign:
    needs: build
    if: vars.SIGNPATH_PROJECT_SLUG != '' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xiaofeiyu-windows-${{ github.sha }}
          path: unsigned

      # SignPath 会按 Artifact Configuration 在包内挑文件，这里只递交安装包，
      # 避免把裸 exe 一起送进去。
      - name: 挑出待签名的安装包
        run: |
          mkdir -p sign-input
          find unsigned -name '*-setup.exe' -type f -exec cp {} sign-input/ \;
          ls -l sign-input
          test -n "$(ls -A sign-input)"

      - uses: actions/upload-artifact@v4
        id: upload-unsigned
        with:
          name: xiaofeiyu-unsigned-${{ github.sha }}
          path: sign-input/*-setup.exe
          if-no-files-found: error
          retention-days: 3

      - name: 提交签名请求
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # 每次签名都要人工批准，等一小时够用；超时说明没人点，宁可失败也别发出未签名包
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-raw

      # 签名产物解压后的目录层级由 Artifact Configuration 决定，统一摊平再上传
      - name: 整理签名产物
        run: |
          mkdir -p signed
          find signed-raw -name '*-setup.exe' -type f -exec cp {} signed/ \;
          ls -l signed
          test -n "$(ls -A signed)"

      - uses: actions/upload-artifact@v4
        with:
          name: xiaofeiyu-signed
          path: signed/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  # 打 tag 直接发布：安装包 + 源码（GitHub 自动附 tag 的 zip/tar.gz）
  release:
    needs: [build, sign]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 发行说明在仓库里（.github/release-notes.md），必须先拿代码
      - uses: actions/checkout@v4

      # 有签名产物就用它；sign 任务没跑（未配 SignPath）时回落到构建产物
      - name: 下载已签名安装包
        id: dl-signed
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: xiaofeiyu-signed
          path: dist-artifact

      - name: 下载未签名安装包
        if: steps.dl-signed.outcome != 'success'
        uses: actions/download-artifact@v4
        with:
          name: xiaofeiyu-windows-${{ github.sha }}
          path: dist-artifact

      - name: 创建 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          # 只发 NSIS 安装包：裸 exe 少了旁边的 resources 目录跑不起来，单发会误导。
          # download-artifact 会还原目录结构，所以不能只匹配顶层 *.exe。
          FILES=$(find dist-artifact -name '*-setup.exe' -type f)
          if [ -z "$FILES" ]; then
            echo "没有找到 NSIS 安装包（*-setup.exe）"
            find dist-artifact -type f
            exit 1
          fi

          # 幂等：重打同一个 tag 时先删掉旧 release，否则会残留旧附件
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，先删除后重建"
            gh release delete "$TAG" --yes
          fi

          # 发行说明只写「修复的 bug」和「新增功能」，零碎改动不列；
          # 没有大改动时只改版本号即可（本文件不用动）。
          gh release create "$TAG" \
            --title "小肥鱼宠物 $TAG" \
            --notes-file .github/release-notes.md \
            $FILES
